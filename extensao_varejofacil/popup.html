<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Lançador NF</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 340px;
      min-height: 420px;
      background: #0b0f19;
      color: #e2e8f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
    }
    .header {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      padding: 14px 16px;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-icon { font-size: 22px; }
    .header-title { font-size: 14px; font-weight: 700; color: #fff; }
    .header-sub { font-size: 10px; color: #64748b; margin-top: 1px; }
    .body { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    label { font-size: 11px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; display: block; }
    textarea {
      width: 100%;
      height: 110px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #e2e8f0;
      font-family: 'Consolas', monospace;
      font-size: 11px;
      padding: 8px;
      resize: vertical;
      outline: none;
    }
    textarea:focus { border-color: #3b82f6; }
    textarea::placeholder { color: #475569; }
    .format-hint {
      font-size: 10px;
      color: #475569;
      margin-top: -6px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 5px;
      padding: 6px 8px;
      font-family: monospace;
    }
    .format-hint strong { color: #38bdf8; }
    .row { display: flex; gap: 8px; align-items: flex-end; }
    .row > * { flex: 1; }
    input[type="file"] {
      display: none;
    }
    .btn-upload {
      display: block;
      width: 100%;
      background: #1e293b;
      border: 1px dashed #334155;
      border-radius: 6px;
      color: #94a3b8;
      font-size: 11px;
      padding: 7px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .btn-upload:hover { border-color: #3b82f6; color: #3b82f6; }
    select {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 12px;
      padding: 7px 8px;
      outline: none;
      cursor: pointer;
    }
    .btn {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-start { background: #10b981; color: #fff; }
    .btn-start:hover:not(:disabled) { background: #059669; }
    .btn-row { display: flex; gap: 6px; }
    .btn-pause { background: #f59e0b; color: #000; flex: 1; }
    .btn-stop { background: #ef4444; color: #fff; flex: 1; }
    .btn-pause:hover:not(:disabled) { background: #d97706; }
    .btn-stop:hover:not(:disabled) { background: #dc2626; }
    #prog-container { display: none; }
    .prog-header { display: flex; justify-content: space-between; margin-bottom: 5px; }
    .prog-header span { font-size: 11px; color: #94a3b8; }
    .prog-bar-bg { background: #1e293b; border-radius: 10px; height: 8px; overflow: hidden; }
    .prog-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #10b981, #3b82f6);
      border-radius: 10px;
      width: 0%;
      transition: width 0.4s ease;
    }
    #ext-status {
      font-size: 11px;
      color: #94a3b8;
      background: #1e293b;
      border-radius: 6px;
      padding: 7px 10px;
      min-height: 32px;
      border: 1px solid #334155;
    }
    .divider { border: none; border-top: 1px solid #1e293b; margin: 2px 0; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">🚀</div>
    <div>
      <div class="header-title">Auto Lançador NF</div>
      <div class="header-sub">Newshop · VarejoFácil Integration v2.0</div>
    </div>
  </div>

  <div class="body">
    <!-- Upload ou cole -->
    <div>
      <label>📋 Lista de Produtos</label>
      <textarea id="ext-data" placeholder="Cole aqui no formato:&#10;Codigo;QTD;Valor&#10;1234;5;29,90&#10;5678;10;14,50&#10;&#10;(Valor é opcional)"></textarea>
      <div class="format-hint">
        Formatos aceitos: <strong>Codigo;QTD</strong> ou <strong>Codigo;QTD;Valor</strong>
      </div>
    </div>

    <!-- Upload de arquivo -->
    <div>
      <label for="ext-file" class="btn-upload">📁 Carregar arquivo .txt / .csv</label>
      <input type="file" id="ext-file" accept=".txt,.csv">
    </div>

    <!-- Velocidade -->
    <div>
      <label>⚡ Velocidade de Lançamento</label>
      <select id="ext-speed">
        <option value="2000">🐢 Lenta (2s) — Conexão Lenta</option>
        <option value="1400" selected>🚶 Normal (1,4s) — Recomendado</option>
        <option value="900">🏃 Rápida (0,9s) — Boa Conexão</option>
        <option value="600">⚡ Turbo (0,6s) — Risco de Falha</option>
      </select>
    </div>

    <hr class="divider">

    <!-- Botão Start -->
    <button class="btn btn-start" id="ext-btn-start">▶️ Iniciar Lançamento Automático</button>

    <!-- Pause / Stop -->
    <div class="btn-row">
      <button class="btn btn-pause" id="ext-btn-pause" disabled>⏸️ Pausar</button>
      <button class="btn btn-stop" id="ext-btn-stop" disabled>⏹️ Parar</button>
    </div>

    <!-- Progresso -->
    <div id="prog-container">
      <div class="prog-header">
        <span id="ext-prog-text">0 / 0</span>
        <span id="ext-prog-pct">0%</span>
      </div>
      <div class="prog-bar-bg">
        <div class="prog-bar-fill" id="ext-prog-fill"></div>
      </div>
    </div>

    <!-- Status -->
    <div id="ext-status">Aguardando itens para lançar...</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
